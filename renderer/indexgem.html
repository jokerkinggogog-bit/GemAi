<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>GemAI</title>
<style>
:root{--bg:#0f0c1a;--side:#15112a;--fg:#f1ecff;--mut:#9a92b8;--card:#1c1736;--line:#2d2548;--accent:#8b5cf6}
:root[data-theme=light]{--bg:#f6f3ff;--side:#ece6ff;--fg:#1a1330;--mut:#5d5578;--card:#fff;--line:#d9d0f3}
*{box-sizing:border-box}
body{margin:0;height:100vh;background:var(--bg);color:var(--fg);font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden}
button,input,select{font:inherit;color:var(--fg)}
input,select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px;outline:none}
input:focus{border-color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 14px;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--accent)}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
/* lock screen */
#lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:5;
 background:radial-gradient(900px 500px at 20% 10%,color-mix(in srgb,var(--accent) 35%,transparent),transparent),radial-gradient(700px 500px at 90% 90%,color-mix(in srgb,var(--accent) 20%,transparent),transparent),var(--bg)}
.lockcard{width:min(400px,92vw);background:color-mix(in srgb,var(--card) 88%,transparent);border:1px solid var(--line);border-radius:20px;padding:34px 30px;text-align:center;backdrop-filter:blur(14px);box-shadow:0 30px 80px rgba(0,0,0,.35)}
.gem{width:74px;height:74px;filter:drop-shadow(0 0 18px var(--accent));animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px)}}
.lockcard h1{margin:10px 0 4px;font-size:28px}.lockcard p{margin:0 0 20px;color:var(--mut);font-size:14px}
.lockcard .btn{width:100%;margin-top:10px}
.or{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12px;margin:16px 0 4px}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
#lstat{min-height:20px;margin-top:12px;font-size:13px;color:var(--mut)}
/* app */
#app{display:none;height:100vh;grid-template-columns:260px 1fr}
#app.on{display:grid}
aside{background:var(--side);border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:8px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;margin-bottom:8px}
.nav{text-align:left;width:100%}.nav.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 22%,var(--card))}
.sp{flex:1}
.acct{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:13px}
.badge{display:inline-block;background:var(--accent);color:#fff;border-radius:7px;padding:2px 9px;font-size:11px;font-weight:700;margin-bottom:6px}
.acct small{display:block;color:var(--mut);word-break:break-all;margin-bottom:8px}
.acct .row{display:flex;gap:6px;margin-top:6px}.acct input{width:100%;padding:8px 10px;font-size:12px}
details summary{cursor:pointer;color:var(--mut);margin-top:8px}details label{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
main{display:flex;flex-direction:column;min-width:0}
#chat{flex:1;overflow:auto;padding:28px;display:flex;flex-direction:column;gap:12px}
.hello{margin:auto;text-align:center;max-width:520px}.hello h2{font-size:30px;margin:0 0 8px}.hello p{color:var(--mut)}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:8px 14px;cursor:pointer;font-size:13px}.chip:hover{border-color:var(--accent)}
.m{max-width:72ch;padding:12px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);white-space:pre-wrap;line-height:1.5}
.m.u{align-self:flex-end;background:var(--accent);border-color:var(--accent);color:#fff}
.bar{display:flex;gap:8px;padding:14px 22px;border-top:1px solid var(--line)}.bar input{flex:1}
</style>
</head>
<body>
<div id="lock"><div class="lockcard">
<svg class="gem" viewBox="0 0 200 200"><g fill="var(--accent)" stroke="var(--bg)" stroke-width="3"><polygon points="60,40 140,40 100,20"/><polygon points="60,40 100,20 30,70" opacity=".7"/><polygon points="140,40 100,20 170,70" opacity=".85"/><polygon points="30,70 60,40 100,70" opacity=".9"/><polygon points="60,40 140,40 100,70"/><polygon points="140,40 170,70 100,70" opacity=".75"/><polygon points="30,70 100,70 100,180" opacity=".8"/><polygon points="170,70 100,70 100,180" opacity=".6"/></g></svg>
<h1>GemAI</h1><p>Sign in to unlock the app.</p>
<button class="btn p" id="google">Continue with Google</button>
<div class="or">or use a key</div>
<input id="lkey" placeholder="GEM-PRO-XXXX-XXXX-XXXX" style="width:100%;margin-top:8px">
<button class="btn" id="lunlock">Unlock with key</button>
<div id="lstat"></div>
<button class="btn" id="preview" style="display:none">Preview the app (setup mode)</button>
</div></div>

<div id="app">
<aside>
<div class="logo">💎 GemAI</div>
<button class="btn nav sel" id="mchat">💬 Chat</button>
<button class="btn nav" id="mcode">⌨️ GemCode <span id="lockic"></span></button>
<button class="btn nav" id="newc">＋ New chat</button>
<div class="sp"></div>
<div class="acct"><span class="badge" id="plan">FREE</span><small id="who"></small>
<div class="row"><input id="key" placeholder="Redeem a key"><button class="btn p" id="redeem" style="padding:8px 10px">Go</button></div>
<details><summary>Settings</summary>
<label>Accent <input type="color" id="acc" value="#8b5cf6" style="padding:0;width:40px;height:28px"></label>
<label>Theme <select id="th"><option value="dark">Dark</option><option value="light">Light</option></select></label></details>
<button class="btn" id="signout" style="width:100%;margin-top:10px;padding:8px">Sign out</button></div>
</aside>
<main><div id="chat"></div>
<div class="bar"><input id="msg" placeholder="Message GemAI"><button class="btn p" id="send">Send</button></div></main>
</div>
<script src="app.js"></script>
</body>
</html>
